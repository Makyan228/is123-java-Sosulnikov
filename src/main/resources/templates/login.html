<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sklad System | Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page-body">

<div class="login-page-shell">
    <div class="login-card-box">
        <div class="login-card-brand">
            <div class="login-card-logo">SK</div>
            <div class="login-card-brand-text">
                <div class="login-card-brand-title">Sklad System</div>
                <div class="login-card-brand-subtitle">Вход в систему склада</div>
            </div>
        </div>

        <div class="login-card-header">
            <h1>Авторизация</h1>
            <p>Выберите тип пользователя и введите логин с паролем</p>
        </div>

        <div class="login-card-alert login-card-alert-error"
             th:if="${errorMessage}"
             th:text="${errorMessage}">
            Ошибка входа
        </div>

        <div class="login-card-alert login-card-alert-success"
             th:if="${successMessage}"
             th:text="${successMessage}">
            Вы вышли из системы
        </div>

        <form th:action="@{/login}" method="post" class="login-card-form">
            <div class="login-card-field">
                <label for="roleName">Тип пользователя</label>
                <select id="roleName" name="roleName" required>
                    <option value="" disabled th:selected="${roleName == null}">
                        Выберите тип пользователя
                    </option>

                    <option value="ADMIN"
                            th:selected="${roleName == 'ADMIN'}">
                        Администратор
                    </option>

                    <option value="RECEIPT_OPERATOR"
                            th:selected="${roleName == 'RECEIPT_OPERATOR'}">
                        Оператор поступлений
                    </option>

                    <option value="SHIPMENT_OPERATOR"
                            th:selected="${roleName == 'SHIPMENT_OPERATOR'}">
                        Оператор отгрузок
                    </option>

                    <option value="LOADER"
                            th:selected="${roleName == 'LOADER'}">
                        Грузчик
                    </option>
                </select>
            </div>

            <div class="login-card-field">
                <label for="username">Логин</label>
                <input id="username"
                       type="text"
                       name="username"
                       th:value="${username}"
                       placeholder="Например: loader01"
                       autocomplete="username"
                       required>
            </div>

            <div class="login-card-field">
                <label for="password">Пароль</label>
                <input id="password"
                       type="password"
                       name="password"
                       placeholder="Введите пароль"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit" class="login-card-submit">Войти</button>
        </form>
    </div>
</div>

</body>
</html>
